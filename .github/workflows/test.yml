name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      comprehensive:
        description: Run the comprehensive test suite
        required: true
        type: boolean
        default: false

jobs:
  core-preprocessing:
    name: Core preprocessing and branding
    if: >-
      github.event_name != 'schedule' &&
      github.event_name != 'push' &&
      !(github.event_name == 'workflow_dispatch' && inputs.comprehensive) &&
      !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'comprehensive-tests'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cached test image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ngsolve-gui-tests
          load: true
          cache-from: type=gha,scope=ngsolve-gui-tests
          cache-to: type=gha,scope=ngsolve-gui-tests,mode=max

      # Keep viewport-sensitive generic renderer screenshots in the full suite below.
      # The fake-solver lifecycle cases are small and do not execute FEM workloads.
      - name: Run core preprocessing checks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests/output:/app/tests/output" \
            ngsolve-gui-tests pytest -q \
            tests/test_branding.py \
            tests/test_axisymmetric_model.py \
            tests/test_axisymmetric_geometry_preview_e2e.py \
            tests/test_file_loader.py \
            tests/test_project_startup.py \
            tests/test_run_history.py \
            tests/test_three_d_mesh.py \
            tests/test_three_d_preview.py \
            tests/test_three_d_project.py \
            tests/test_three_d_solver_setup.py \
            tests/test_three_d_workspace.py \
            tests/test_three_d_workspace_e2e.py \
            tests/test_three_d_solver_e2e.py::test_3d_failed_process_finishes_with_actionable_diagnostics \
            tests/test_three_d_solver_e2e.py::test_3d_cancelled_process_finishes_with_cancelled_status

      - name: Upload core test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-output
          path: tests/output/

  test:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.comprehensive) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'comprehensive-tests'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cached test image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ngsolve-gui-tests
          load: true
          cache-from: type=gha,scope=ngsolve-gui-tests
          cache-to: type=gha,scope=ngsolve-gui-tests,mode=max

      - name: Run comprehensive suite
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/tests/output:/app/tests/output" \
            ngsolve-gui-tests pytest -q --junitxml=/app/tests/output/comprehensive-junit.xml

      - name: Upload comprehensive test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-output
          path: tests/output/
          if-no-files-found: warn
